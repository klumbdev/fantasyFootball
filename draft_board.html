<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Draft Board</title>
<style>
:root{
  --bg:#0d1117; --panel:#161b22; --line:#262d38; --line2:#1c2128;
  --fg:#e6edf3; --dim:#8b949e; --faint:#5a636d;
  --qb:#f2777a; --rb:#69c493; --wr:#6cb6ff; --te:#e3b341; --k:#a5a5b5; --dst:#b98cf0;
  --good:#3fb950; --warn:#d29922; --bad:#f85149; --accent:#7c5cff;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);
  font:14px/1.45 ui-sans-serif,-apple-system,"Segoe UI",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased}
.num{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-numeric:tabular-nums}

header{position:sticky;top:0;z-index:20;background:var(--panel);
  border-bottom:1px solid var(--line);padding:10px 16px;
  display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.stat{display:flex;flex-direction:column;line-height:1.2}
.stat b{font-size:19px;font-weight:650}
.stat span{font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--faint)}
.stat.hi b{color:var(--accent)}
header .spacer{flex:1}
select,input[type=number]{background:var(--bg);color:var(--fg);border:1px solid var(--line);
  border-radius:6px;padding:5px 8px;font:inherit}
button{background:var(--line2);color:var(--fg);border:1px solid var(--line);
  border-radius:6px;padding:6px 11px;font:inherit;cursor:pointer}
button:hover{background:var(--line);border-color:#3a4351}
button:disabled{opacity:.35;cursor:not-allowed}

.wrap{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;
  padding:16px;max-width:1500px;margin:0 auto;align-items:start}
@media(max-width:1000px){.wrap{grid-template-columns:1fr}}

.toolbar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;align-items:center}
#q{flex:1;min-width:200px;background:var(--panel);border:1px solid var(--line);
  border-radius:8px;padding:9px 13px;color:var(--fg);font:inherit}
#q:focus{outline:none;border-color:var(--accent)}
.tab{padding:6px 12px;border-radius:999px;font-size:13px}
.tab.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}

.rows{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel)}
.row{display:grid;grid-template-columns:52px 1fr 62px 74px 128px;gap:10px;
  align-items:center;padding:8px 12px;border-bottom:1px solid var(--line2)}
.row:last-child{border-bottom:none}
.row:hover{background:#1b2230;cursor:pointer}
.row:active{background:#222b3b}
.adp{font-size:15px;font-weight:650;color:var(--dim)}
.nm{font-weight:600;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.meta{font-size:11px;color:var(--faint);margin-top:1px}
.pos{font-size:10px;font-weight:800;letter-spacing:.05em;padding:2px 6px;border-radius:4px;color:#0d1117}
.QB{background:var(--qb)}.RB{background:var(--rb)}.WR{background:var(--wr)}
.TE{background:var(--te)}.K{background:var(--k)}.DST{background:var(--dst)}
.chip{font-size:10px;padding:1px 6px;border-radius:4px;border:1px solid var(--line);color:var(--dim)}
.chip.inj{border-color:var(--bad);color:var(--bad)}
.chip.val{border-color:var(--good);color:var(--good);font-weight:700}
.chip.byeclash{border-color:var(--warn);color:var(--warn)}
.chip.qb6{border-color:var(--qb);color:var(--qb)}
.chip.out{background:var(--bad);border-color:var(--bad);color:#0d1117;font-weight:800}
.chip.risk{border-color:var(--warn);color:var(--warn);font-weight:650}
.chip.watch{border-color:var(--faint);color:var(--faint)}
.chip.early{background:var(--warn);border-color:var(--warn);color:#0d1117;font-weight:800}
.chip.lrank{border-color:var(--accent);color:#c3b5ff}
.row.isout{opacity:.45}
.surv{text-align:right;font-size:13px;font-weight:650}
.acts{display:flex;gap:6px;justify-content:flex-end}
.acts button{padding:5px 9px;font-size:12px}
.mine{border-color:var(--accent);color:#c3b5ff}
.mine:hover{background:var(--accent);color:#fff}
.tierbar{padding:4px 12px;background:#12171f;border-bottom:1px solid var(--line2);
  font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}

aside section{background:var(--panel);border:1px solid var(--line);
  border-radius:10px;padding:12px 14px;margin-bottom:14px}
aside h2{margin:0 0 9px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
.slot{display:flex;justify-content:space-between;gap:8px;padding:4px 0;
  border-bottom:1px solid var(--line2);font-size:13px}
.slot:last-child{border-bottom:none}
.slot .lbl{color:var(--faint);font-size:11px;width:42px;flex:none}
.slot .empty{color:var(--faint);font-style:italic}
.need{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.need span{font-size:11px;padding:2px 7px;border-radius:4px;border:1px solid var(--line);color:var(--dim)}
.need span.urgent{border-color:var(--warn);color:var(--warn);font-weight:650}
.note{font-size:11px;color:var(--faint);margin-top:8px;line-height:1.5}
.warnrow{font-size:12px;color:var(--warn);padding:3px 0}
textarea{width:100%;background:var(--bg);color:var(--fg);border:1px solid var(--line);
  border-radius:6px;padding:7px 9px;font:12px/1.4 ui-monospace,Menlo,monospace;resize:vertical}
textarea:focus{outline:none;border-color:var(--accent)}
.cfg{display:grid;grid-template-columns:1fr 58px;gap:5px 8px;align-items:center;font-size:12px}
.empty-state{padding:26px;text-align:center;color:var(--faint)}
#rec{position:sticky;top:58px;z-index:19;background:linear-gradient(90deg,#241c4d,#1a1730);
  border-bottom:1px solid var(--accent);padding:12px 18px;display:flex;gap:16px;align-items:center}
#rec .lbl{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#b9a8ff;flex:none}
#rec .who{font-size:23px;font-weight:800;letter-spacing:-.01em;line-height:1.1}
#rec .why{font-size:13px;color:#cfc6f5;margin-top:2px}
#rec .mid{flex:1;min-width:0}
#rec .alts{font-size:12px;flex:none;display:flex;flex-direction:column;gap:3px;max-width:340px}
#rec .alt{display:flex;align-items:center;gap:6px;padding:3px 8px;border-radius:6px;
  border:1px solid transparent;cursor:pointer;justify-content:flex-end}
#rec .alt:hover{border-color:var(--accent);background:#2b2350}
#rec .alt b{font-weight:650;color:var(--fg);white-space:nowrap}
#rec .alt .ar{color:#9d92c4;font-size:11px;max-width:210px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#rec button{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700;
  padding:9px 16px;font-size:14px;flex:none}
#rec.wait{background:#181d29;border-bottom-color:var(--line)}
#rec.wait .who{font-size:17px;color:var(--dim)}
#plan{position:sticky;top:118px;z-index:18;display:flex;gap:14px;align-items:baseline;
  padding:8px 18px;background:#141a26;border-bottom:1px solid var(--line);font-size:14px}
#plan b{color:var(--accent);font-weight:800;letter-spacing:.04em;flex:none}
#plan span{color:var(--fg)}
#plan i{color:var(--faint);font-style:normal;font-size:12px;margin-left:auto;flex:none}
.planrow{display:flex;gap:10px;padding:4px 0;font-size:12px;color:var(--faint);
  border-bottom:1px solid var(--line2)}
.planrow:last-child{border-bottom:none}
.planrow b{flex:none;width:42px;font-weight:600}
.planrow.now{color:var(--fg)}
.planrow.now b{color:var(--accent)}
.planrow.done{opacity:.4}
#alert{display:none;position:sticky;top:157px;z-index:19;padding:11px 18px;
  font-size:15px;font-weight:750;letter-spacing:.01em;color:#0d1117;
  align-items:center;gap:12px;border-bottom:2px solid rgba(0,0,0,.35)}
#alert.on{display:flex;animation:pulse 1.4s ease-in-out infinite}
#alert .big{font-size:20px;font-weight:850;letter-spacing:.04em}
@keyframes pulse{0%,100%{filter:brightness(1)}50%{filter:brightness(1.22)}}
@media(prefers-reduced-motion:reduce){#alert.on{animation:none}}
</style>
</head>
<body>

<header>
  <div class="stat"><span>Pick</span><b class="num" id="hPick">–</b></div>
  <div class="stat"><span>Runde</span><b class="num" id="hRound">–</b></div>
  <div class="stat hi"><span>Mein n. Pick</span><b class="num" id="hNext">–</b></div>
  <div class="stat"><span>Board</span><b class="num" id="hLeft">–</b></div>
  <div class="spacer"></div>
  <label style="font-size:12px;color:var(--dim)">Teams
    <select id="teams"></select>
  </label>
  <label style="font-size:12px;color:var(--dim)">Draft-Slot
    <select id="slot"></select>
  </label>
  <button id="undo">Undo</button>
  <button id="reset">Reset</button>
</header>

<div id="rec"></div>
<div id="plan"></div>
<div id="alert"></div>

<div class="wrap">
  <main>
    <div class="toolbar">
      <input id="q" placeholder="Suchen … (Enter = weg) · oder direkt auf eine Zeile klicken" autocomplete="off">
      <button class="tab on" data-p="ALL">Alle</button>
      <button class="tab" data-p="QB">QB</button>
      <button class="tab" data-p="RB">RB</button>
      <button class="tab" data-p="WR">WR</button>
      <button class="tab" data-p="TE">TE</button>
      <button class="tab" data-p="K">K</button>
      <button class="tab" data-p="DST">DST</button>
    </div>
    <div class="rows" id="list"></div>
  </main>

  <aside>
    <section>
      <h2>Picks abgleichen</h2>
      <textarea id="sync" rows="3" placeholder="Pickliste aus Yahoo hier einfügen …"></textarea>
      <div style="display:flex;gap:8px;margin-top:7px;align-items:center">
        <button id="syncBtn">Übernehmen</button>
        <span class="note" id="syncNote" style="margin:0"></span>
      </div>
    </section>
    <section>
      <h2>Mein Kader</h2>
      <div id="roster"></div>
      <div class="need" id="needs"></div>
    </section>
    <section>
      <h2>Bye-Week-Check</h2>
      <div id="byes"><div class="note">Noch keine Spieler.</div></div>
    </section>
    <section>
      <h2>Positionslauf</h2>
      <div id="runs"></div>
      <div class="note" id="runNote"></div>
    </section>
    <section>
      <h2>Draft-Plan</h2>
      <div id="planlist"></div>
    </section>
    <section>
      <h2>Startaufstellung</h2>
      <div class="cfg" id="cfg"></div>
      <div class="note" id="src"></div>
    </section>
  </aside>
</div>

const P = DATA.players, M = DATA.meta;
let T = M.teams;   // im Kopf umstellbar, damit Mock-Drafts anderer Groesse passen
const LS = "draftboard_" + M.season + "_" + T;

// Bei Aenderungen an der Startaufstellung hochzaehlen: ein im Browser
// gespeicherter Draft behaelt sonst die alte, inzwischen falsche Aufstellung.
const LINEUP_V = 2;
const DEFAULT_LINEUP = {QB:1, RB:2, WR:2, TE:1, FLEX:1, K:1, DST:1};

let S = load() || { drafted: {}, mine: [], order: [], slot: 1, teams: T,
                    v: LINEUP_V, lineup: {...DEFAULT_LINEUP} };
T = S.teams || M.teams;
if (S.v !== LINEUP_V) { S.lineup = {...DEFAULT_LINEUP}; S.v = LINEUP_V; }

function load(){ try { return JSON.parse(localStorage.getItem(LS)); } catch(e){ return null; } }
function save(){ try { localStorage.setItem(LS, JSON.stringify(S)); } catch(e){} }

/* ---- Snake-Draft-Mathematik ---- */
const pickNo = () => S.order.length + 1;
const roundOf = n => Math.ceil(n / T);
const myPicks = () => {
  const out = [];
  for (let r = 1; r <= 18; r++)
    out.push((r - 1) * T + (r % 2 ? S.slot : T - S.slot + 1));
  return out.sort((a, b) => a - b);
};
const myNext = () => myPicks().find(p => p >= pickNo()) || null;

/* Wahrscheinlichkeit, dass ein Spieler bis Pick n noch da ist.
   ADP ist ueber die Drafts naeherungsweise normalverteilt. */
function erf(x){
  const s = Math.sign(x); x = Math.abs(x);
  const t = 1 / (1 + 0.3275911 * x);
  const y = 1 - ((((1.061405429*t - 1.453152027)*t + 1.421413741)*t - 0.284496736)*t + 0.254829592) * t * Math.exp(-x*x);
  return s * y;
}
const cdf = (x, mu, sd) => 0.5 * (1 + erf((x - mu) / (Math.max(sd, 0.1) * Math.SQRT2)));
function survival(p, n){
  if (!n) return null;
  // Gegen das Verhalten DIESER Liga rechnen, nicht gegen den Marktdurchschnitt.
  const adp = p.ladp != null ? p.ladp : p.adp;
  const sd  = p.ladp != null ? p.lstdev : p.stdev;
  const taken = cdf(n - 0.5, adp, sd) - cdf(0.5, adp, sd);
  return Math.max(0, Math.min(1, 1 - taken / Math.max(1e-9, 1 - cdf(0.5, adp, sd))));
}

/* ---- Zustand ---- */
const avail = () => P.filter(p => !S.drafted[p.id]);
const myTeam = () => S.mine.map(id => P.find(p => p.id === id)).filter(Boolean);

function draft(id, isMine){
  if (S.drafted[id]) return;
  S.drafted[id] = isMine ? "me" : "other";
  S.order.push(id);
  if (isMine) S.mine.push(id);
  S.lastSync = [];                       // manueller Pick beendet den Block
  save(); render();
}
function undo(){
  // Ein Sammelabgleich kann hundert Spieler streichen. Der muss sich in einem
  // Zug zuruecknehmen lassen, nicht in hundert Klicks.
  if (S.lastSync && S.lastSync.length){
    for (const id of S.lastSync){
      delete S.drafted[id];
      S.order = S.order.filter(x => x !== id);
    }
    S.lastSync = [];
    save(); render();
    return;
  }
  const id = S.order.pop();
  if (!id) return;
  delete S.drafted[id];
  S.mine = S.mine.filter(x => x !== id);
  save(); render();
}

/* ---- Kaderlogik ---- */
const FLEXOK = ["RB", "WR", "TE"];
function fillSlots(){
  const team = myTeam().slice(), slots = [], L = S.lineup;
  for (const pos of ["QB","RB","WR","TE","FLEX","K","DST"]){
    for (let i = 0; i < (L[pos] || 0); i++){
      const idx = team.findIndex(p => pos === "FLEX" ? FLEXOK.includes(p.pos) : p.pos === pos);
      slots.push({ lbl: pos, p: idx >= 0 ? team.splice(idx, 1)[0] : null });
    }
  }
  return { slots, bench: team };
}
function needs(){
  const { slots } = fillSlots(), open = {};
  slots.filter(s => !s.p).forEach(s => open[s.lbl] = (open[s.lbl] || 0) + 1);
  return open;
}

/* ---- Rendering ---- */
let filter = "ALL", query = "";

function render(){
  const n = pickNo(), next = myNext();
  hPick.textContent = n;
  hRound.textContent = roundOf(n);
  hNext.textContent = next ? next + "  (in " + (next - n) + ")" : "–";
  hLeft.textContent = avail().length;

  const open = needs();
  let pool = avail();
  if (filter !== "ALL") pool = pool.filter(p => p.pos === filter);
  if (query){
    // Yahoo zeigt "K. WALKER III", das Board "Kenneth Walker". Beide Formen
    // muessen zum Ziel fuehren, sonst sucht man waehrend der Uhr vergeblich.
    const q = query.toLowerCase().trim();
    const bare = q.replace(/^[a-z]\.\s*/, "");
    pool = pool.filter(p => {
      const hay = (p.name + " " + p.team + " " + (p.alias || "")).toLowerCase();
      if (hay.includes(q) || (bare && hay.includes(bare))) return true;
      return /^[a-z]\./.test(q) && pattern(p).test(query);
    });
  }

  const myByes = {};
  myTeam().forEach(p => { if (["RB","WR","TE","QB"].includes(p.pos)) myByes[p.bye] = (myByes[p.bye]||0)+1; });

  const shown = pool.slice(0, 90);
  let html = "", lastTier = null;
  for (const p of shown){
    const key = p.pos + p.tier;
    if (filter !== "ALL" && key !== lastTier){
      html += '<div class="tierbar">' + p.pos + " · Tier " + p.tier + "</div>";
      lastTier = key;
    }
    const sv = survival(p, next);
    const svTxt = sv === null ? "–" : Math.round(sv * 100) + "%";
    const svCol = sv === null ? "var(--faint)" : sv > .7 ? "var(--good)" : sv > .35 ? "var(--warn)" : "var(--bad)";
    const falling = p.adp <= n - T * 0.5;
    const chips =
      (p.sev ? '<span class="chip ' + p.sev + '">' +
        (p.sev === "out" ? "RAUS" : p.sev === "risk" ? "angeschlagen" : "offen") +
        ": " + p.injNote + "</span>" : "") +
      (p.inj && !p.sev ? '<span class="chip inj">' + p.inj + "</span>" : "") +
      (falling ? '<span class="chip val">fällt ' + Math.round(n - p.adp) + "</span>" : "") +
      (myByes[p.bye] >= 2 ? '<span class="chip byeclash">Bye ' + p.bye + " ×" + myByes[p.bye] + "</span>" : "") +
      (open[p.pos] ? '<span class="chip">Bedarf</span>' : "") +
      (p.pos === "QB" ? '<span class="chip qb6">6-Pkt-TD</span>' : "") +
      (p.lrank ? '<span class="chip lrank">Liga #' + p.lrank + "</span>" : "") +
      (p.ldelta >= 4 ? '<span class="chip early">geht ~' + Math.round(p.ldelta) +
        ' früher</span>' : "");
    html +=
      '<div class="row' + (p.sev === "out" ? " isout" : "") +
        '" onclick="rowClick(event,' + p.id + ')">' +
        '<div class="adp num">' + p.adpFmt + "</div>" +
        '<div><div class="nm">' + (p.yname || p.name) +
          '<span class="pos ' + p.pos + '">' + p.pos + p.pos_rank + "</span>" + chips + "</div>" +
          '<div class="meta">' + p.name + " · " + p.team + " · Bye " + p.bye + " · Tier " + p.tier +
            (p.age ? " · " + p.age + "J" : "") +
            (p.depth ? " · DC" + p.depth : "") +
            (p.vor != null ? " · VOR " + Math.round(p.vor) + " (#" + p.vorRank + ")" : " · n=" + p.n) + "</div></div>" +
        '<div class="surv num" style="color:' + svCol + '">' + svTxt + "</div>" +
        '<div class="num" style="text-align:right;font-size:11px;color:var(--faint)">' + p.high + "–" + p.low + "</div>" +
        '<div class="acts">' +
          '<button onclick="draft(' + p.id + ',false)">weg</button>' +
          '<button class="mine" onclick="draft(' + p.id + ',true)">ich</button>' +
        "</div></div>";
  }
  list.innerHTML = html || '<div class="empty-state">Kein Treffer.</div>';

  const { slots, bench } = fillSlots();
  roster.innerHTML =
    slots.map(s => '<div class="slot"><span class="lbl">' + s.lbl + "</span>" +
      (s.p ? "<span>" + (s.p.yname || s.p.name) + '</span><span style="color:var(--faint);font-size:11px">' + s.p.team + " B" + s.p.bye + "</span>"
           : '<span class="empty">offen</span><span></span>') + "</div>").join("") +
    bench.map(p => '<div class="slot"><span class="lbl">BN</span><span>' + (p.yname || p.name) +
      '</span><span style="color:var(--faint);font-size:11px">' + p.pos + " B" + p.bye + "</span></div>").join("");
  needsEl.innerHTML = Object.entries(open).map(([k, v]) =>
    '<span class="' + (v > 1 ? "urgent" : "") + '">' + k + " ×" + v + "</span>").join("") ||
    '<span>Startelf komplett</span>';

  const clash = Object.entries(myByes).filter(([, c]) => c >= 2);
  byes.innerHTML = clash.length
    ? clash.map(([w, c]) => '<div class="warnrow">Week ' + w + ": " + c + " Starter gleichzeitig raus</div>").join("")
    : '<div class="note">Keine Häufung. Ab 2 Startern pro Bye wird gewarnt.</div>';

  // Fenster der letzten 8 Picks: ein Run ist, wenn die Haelfte davon dieselbe
  // Position trifft. Ueber 12 Picks verwaessert das Signal zu stark.
  const last = S.order.slice(-8).map(id => P.find(p => p.id === id)).filter(Boolean);
  const cnt = {};
  last.forEach(p => cnt[p.pos] = (cnt[p.pos] || 0) + 1);
  runs.innerHTML = Object.entries(cnt).sort((a, b) => b[1] - a[1])
    .map(([k, v]) => '<div class="slot"><span class="lbl ' + k + '" style="width:auto">' + k +
      '</span><span style="color:var(--dim)">' + v + " der letzten " + last.length + "</span><span></span></div>").join("")
    || '<div class="note">Noch keine Picks erfasst.</div>';
  const hot = Object.entries(cnt).sort((a, b) => b[1] - a[1])[0];
  const isRun = hot && last.length >= 4 && hot[1] >= Math.max(4, Math.ceil(last.length / 2));
  runNote.textContent = isRun
    ? "Run auf " + hot[0] + " – die Position leert sich schneller als die ADP unterstellt."
    : "Kein akuter Run.";
  // --- Empfehlungsfeld ---
  const R = recommend();
  const recEl = document.getElementById("rec");
  if (R){
    const p = R.top.p, mine = R.mine;
    const why = R.top.why.length ? R.top.why[0] : "bester verfügbarer Spieler im Rundenplan";
    recEl.className = mine ? "" : "wait";
    recEl.innerHTML =
      '<div class="lbl">' + (mine ? "Du bist dran<br>nimm" : "Pick " + next + "<br>in " + (next - n)) + "</div>" +
      '<div class="mid"><div class="who">' + (p.yname || p.name) +
        ' <span class="pos ' + p.pos + '">' + p.pos + p.pos_rank + "</span></div>" +
        '<div class="why">' + why[0].toUpperCase() + why.slice(1) +
        (R.top.why.length > 1 ? " · " + R.top.why[1] : "") +
        "</div></div>" +
      '<div class="alts">' + R.alts.map(a =>
        '<div class="alt" onclick="draft(' + a.p.id + ',true)">' +
          '<b>' + (a.p.yname || a.p.name) + '</b> <span class="pos ' + a.p.pos + '">' + a.p.pos + a.p.pos_rank + "</span>" +
          '<span class="ar">' + (a.why[0] || "solide Alternative") + "</span></div>").join("") + "</div>" +
      '<button onclick="draft(' + p.id + ',true)">nehmen</button>';
  } else recEl.innerHTML = "";

  const [pa, pb, ptitle, phint] = planFor(roundOf(n));
  document.getElementById("plan").innerHTML =
    "<b>RUNDE " + roundOf(n) + "</b><span>" + ptitle + "</span><i>" + phint + "</i>";
  document.getElementById("planlist").innerHTML = PLAN.map(([a, b, t]) => {
    const cur = roundOf(n) >= a && roundOf(n) <= b;
    return '<div class="planrow ' + (cur ? "now" : roundOf(n) > b ? "done" : "") + '"><b>' +
      (a === b ? a : a + "-" + b) + "</b><span>" + t + "</span></div>";
  }).join("");

  const bar = document.getElementById("alert");
  if (isRun){
    const col = {QB:"--qb", RB:"--rb", WR:"--wr", TE:"--te", K:"--k", DST:"--dst"}[hot[0]];
    bar.style.background = "var(" + col + ")";
    bar.innerHTML = '<span class="big">RUN AUF ' + hot[0] + "</span>" +
      "<span>" + hot[1] + " der letzten " + last.length + " Picks – " +
      (open[hot[0]] ? "du brauchst die Position noch. Vorziehen lohnt."
                    : "du bist dort versorgt. Andere greifen zu, du nimmst den Value woanders.") +
      "</span>";
    bar.classList.add("on");
  } else bar.classList.remove("on");
  save();
}

/* ---- Draft-Plan ----
   Abgeleitet aus den Liga-Settings: 8 Teams heben das Replacement Level so
   hoch, dass RB/WR frueh nie knapp sind, waehrend Yahoos liga-eigene Liste
   TE und QB nach vorne zieht - also die beiden Positionen, die man laufen
   lassen und spaeter billiger nachholen kann. */
const PLAN = [
  [1, 12, "Bester Mehrwert",    "VOR entscheidet, nicht die Position", ["QB","RB","WR","TE"]],
  [13,13, "Letzter Skill-Pick", "danach nur noch Kicker und Defense", ["QB","RB","WR","TE"]],
  [14,15, "Kicker und Defense", "keinen Pick früher dafür ausgeben", ["K","DST"]],
];

/* ---- Empfehlung ----
   Rein lokal gerechnet, damit sie in der 45-Sekunden-Uhr sofort dasteht.
   Der Kern ist nicht "wer ist der Beste", sondern "wen verliere ich, wenn
   ich warte": bei zwei aehnlich guten Spielern gewinnt der, der bis zum
   nächsten Pick am wenigsten wahrscheinlich noch da ist. */
// Wie viele Spieler einer Position ueberhaupt Sinn ergeben. Bei 8 Teams ist
// der Waiver Wire das ganze Jahr voll: ein zweiter QB oder TE ist Ballast,
// RB- und WR-Tiefe traegt dagegen ueber Verletzungen und Bye Weeks.
const USEFUL = {QB: 1, RB: 6, WR: 6, TE: 1, K: 1, DST: 1};

// Was ein weiterer Spieler dieser Position DIR noch bringt. VOR misst den Wert
// gegenueber dem Ersatzmann fuer einen Startplatz - ist der besetzt, faellt
// dieser Wert fuer dich weitgehend weg, ligaweit bleibt er aber gleich.
function marginal(pos, open, mine){
  const have = mine.filter(p => p.pos === pos).length;
  if (have >= USEFUL[pos]) return 0;                       // gar nicht mehr vorschlagen
  if (open[pos]) return 1;                                 // Startplatz offen
  if (open.FLEX && FLEXOK.includes(pos)) return 0.85;      // FLEX offen
  return pos === "RB" || pos === "WR" ? 0.45 : 0.15;       // reine Bank
}

function recommend(){
  const n = pickNo(), next = myNext(), open = needs();
  // Bist du am Zug, ist "ist er jetzt da" keine Frage - er steht ja vor dir.
  // Die Entscheidung haengt daran, wen du bis zum UEBERNAECHSTEN Zug verlierst.
  // Ohne diesen Horizont waere die ganze Wartelogik im Moment der Entscheidung
  // wirkungslos.
  const horizon = myPicks().find(p => p > n) || null;
  const want = planFor(roundOf(n))[4].filter(p => open[p] || open.FLEX);
  const runPos = (() => {
    const l = S.order.slice(-8).map(i => P.find(p => p.id === i)).filter(Boolean);
    const c = {}; l.forEach(p => c[p.pos] = (c[p.pos]||0)+1);
    const h = Object.entries(c).sort((a,b) => b[1]-a[1])[0];
    return h && l.length >= 4 && h[1] >= Math.max(4, Math.ceil(l.length/2)) ? h[0] : null;
  })();

  const mine = next === n;
  const roster = myTeam();
  // Bye Weeks der eigenen Starter zaehlen. Drei Ausfaelle in derselben Woche
  // kosten ein Spiel; das gehoert in die Bewertung, nicht nur in eine Anzeige.
  const byeLoad = {};
  fillSlots().slots.forEach(sl => { if (sl.p) byeLoad[sl.p.bye] = (byeLoad[sl.p.bye] || 0) + 1; });
  let pool = avail().filter(p => p.sev !== "out" && marginal(p.pos, open, roster) > 0);
  // Kicker und Defense kosten spaet nichts und blockieren frueh einen Platz.
  if (roundOf(n) < 13) pool = pool.filter(p => p.pos !== "K" && p.pos !== "DST");
  const inPlan = pool.filter(p => want.includes(p.pos));
  if (inPlan.length) pool = inPlan;                    // Plan zuerst, sonst bester Gesamtwert
  // Bist du noch nicht dran, ist das eine Vorschau: wer realistisch bis zu
  // deinem Pick durchkommt. Jemanden zu empfehlen, der sicher weg ist, hilft
  // nicht. Bist du dran, liegen ohnehin nur verfuegbare Spieler vor dir.
  if (!mine){
    const reachable = pool.filter(p => (survival(p, next) ?? 0) >= .25);
    if (reachable.length) pool = reachable;
  }
  if (!pool.length) return null;

  const scored = pool.map(p => {
    const sv = survival(p, mine ? horizon : next) ?? 0;
    const falling = p.adp <= n - T * 0.5;
    const why = [];
    const add = (rank, text) => why.push([rank, text]);
    const mrg = marginal(p.pos, open, roster);
    const clash = byeLoad[p.bye] || 0;

    // Alle Zuschlaege wirken multiplikativ, nicht als feste Abzuege. Sonst
    // reisst ein Bonus von wenigen Punkten die Spitze durcheinander, wo die
    // Spieler nur ein bis zwei Raenge auseinanderliegen, waehrend er in
    // Runde 12 wirkungslos bliebe. Kleiner ist besser.
    let sc = p.vorRank ? p.vorRank : p.adp + 40;
    sc /= mrg;                                   // besetzte Position entwertet stark
    if (mrg < 0.5) add(7, "nur Bankwert - " + p.pos + " ist bei dir besetzt");

    if (sv !== null && horizon !== null){
      sc *= 1 + sv * 0.9;                        // wer sicher durchkommt, kann warten
      const bis = mine ? "bis Pick " + horizon : "bis zu deinem Pick";
      if (sv < .55) add(1, "nur " + Math.round(sv * 100) + "% dass er " + bis + " überlebt");
      else add(3, "wäre " + bis + " voraussichtlich noch da (" + Math.round(sv * 100) + "%)");
    }
    if (open[p.pos]) { sc *= 0.85; add(6, "Startplatz " + p.pos + " noch offen"); }
    if (falling)     { sc *= 0.88; add(2, "fällt " + Math.round(n - p.adp) + " Picks unter seine ADP"); }
    if (p.ldelta >= 4) { sc *= 0.93;
      add(5, "geht in eurer Liga rund " + Math.round(p.ldelta) + " Picks früher als die ADP"); }
    if (p.vor != null && p.adp && p.vorRank && p.adp - p.vorRank >= 8){ sc *= 0.90;
      add(4, "Mehrwert von " + Math.round(p.vor) + " Punkten - der Markt zieht ihn zu spät"); }
    if (clash >= 2 && mrg >= 0.85){ sc *= 1 + clash * 0.14;
      add(8, "Bye " + p.bye + " - dann fehlen dir schon " + clash + " Starter"); }
    if (p.sev === "risk"){ sc *= 1.30;
      add(0, "angeschlagen (" + p.injNote + "), trotzdem der beste Zug"); }

    why.sort((a, b) => a[0] - b[0]);
    return { p, sc, why: why.map(w => w[1]), sv };
  }).sort((a, b) => a.sc - b.sc);

  return { top: scored[0], alts: scored.slice(1, 3), next, runPos, mine };
}
const planFor = r => PLAN.find(([a, b]) => r >= a && r <= b) || PLAN[PLAN.length - 1];

/* ---- Eingabe ----
   Waehrend eines Drafts mit 45 Sekunden pro Pick bleibt keine Zeit, sieben
   gegnerische Zuege abzutippen. Deshalb zwei schnellere Wege: ein Klick auf
   die Zeile streicht den Spieler, und die Pickliste aus Yahoo laesst sich
   als Ganzes einfuegen. */
function rowClick(ev, id){
  if (ev.target.tagName === "BUTTON") return;      // die Knoepfe behalten ihre Funktion
  draft(id, ev.shiftKey);                          // Shift+Klick = das war mein Pick
}

// Yahoo schreibt Picks als "K. WALKER III  RB - KC". Statt Namen zu zerlegen
// und zu hoffen, wird fuer jeden Spieler ein Muster gebaut und im Text gesucht.
// Das haelt "A. BROWN" (A.J. Brown) und "A. ST. BROWN" (Amon-Ra) auseinander.
const SUFFIX = /\s+(?:Jr\.?|Sr\.?|II|III|IV|V)$/i;
const esc = t => t.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");

function pattern(p){
  if (p.alias) return new RegExp("\\b" + esc(p.alias) + "\\b", "gi");   // "Vikings"
  const bits = p.name.replace(SUFFIX, "").split(" ");
  const initial = bits[0][0];
  const surname = bits.slice(1).join(" ") || bits[0];
  // Optionales zweites Initial deckt "A.J. Brown" ab, ohne "A. St. Brown" zu treffen.
  return new RegExp("\\b" + esc(initial) + "\\.\\s*(?:[A-Za-z]\\.\\s*)?" + esc(surname) + "\\b", "gi");
}

function syncPicks(text){
  const pool = avail();
  const at = new Map();                        // Textposition -> Spieler, die dort passen
  for (const p of pool){
    for (const m of text.matchAll(pattern(p))){
      if (!at.has(m.index)) at.set(m.index, []);
      at.get(m.index).push(p);
    }
  }
  const hit = [], unclear = [];
  for (const [pos, list] of at){
    if (list.length === 1) hit.push(list[0]);
    else { const t = text.substr(pos, 20).split("\n")[0].trim();
           if (!unclear.includes(t)) unclear.push(t); }
  }
  // Laengster Treffer gewinnt, wenn sich zwei Muster ueberlappen
  const done = new Set(), ids = [];
  for (const p of hit){
    if (done.has(p.id) || S.drafted[p.id]) continue;
    done.add(p.id);
    S.drafted[p.id] = "other";
    S.order.push(p.id);
    ids.push(p.id);
  }
  return { n: ids.length, unclear, ids };
}

/* ---- Bedienung ---- */
const list = document.getElementById("list"), needsEl = document.getElementById("needs");
document.querySelectorAll(".tab").forEach(b => b.onclick = () => {
  document.querySelectorAll(".tab").forEach(x => x.classList.remove("on"));
  b.classList.add("on"); filter = b.dataset.p; render();
});
q.oninput = e => { query = e.target.value; render(); };
q.onkeydown = e => {
  if (e.key !== "Enter") return;
  let pool = avail();
  if (query){ const s = query.toLowerCase(); pool = pool.filter(p => p.name.toLowerCase().includes(s)); }
  if (!pool.length) return;
  draft(pool[0].id, e.shiftKey);
  q.value = ""; query = ""; render();
};
document.getElementById("undo").onclick = undo;
document.getElementById("reset").onclick = () => {
  if (confirm("Draft wirklich zurücksetzen?")){
    S = { drafted:{}, mine:[], order:[], slot:S.slot, v:LINEUP_V, lineup:S.lineup }; save(); render();
  }
};
document.getElementById("syncBtn").onclick = () => {
  const box = document.getElementById("sync");
  const probe = syncPicks(box.value);
  let r = probe;
  if (probe.n > 20){
    // So viele Picks auf einmal deutet auf die falsche Liste hin - typischer
    // Fall ist die komplette Spielerliste statt der Picks.
    const ok = confirm(probe.n + " Spieler auf einmal streichen?\n\n" +
      "Das ist ungewöhnlich viel. Hast du versehentlich die Spielerliste statt " +
      "der Pickliste kopiert?\n\nAbbrechen macht es sofort rückgängig.");
    if (!ok){
      for (const id of probe.ids){ delete S.drafted[id]; S.order = S.order.filter(x => x !== id); }
      r = { n: 0, unclear: [], ids: [] };
    }
  }
  S.lastSync = r.ids;
  const note = document.getElementById("syncNote");
  note.textContent = (r.n ? r.n + " gestrichen · Undo nimmt alle zurück" : "nichts Neues erkannt") +
    (r.unclear.length ? " · unklar, bitte anklicken: " + r.unclear.join(", ") : "");
  note.style.color = r.unclear.length ? "var(--warn)" : "var(--faint)";
  box.value = "";
  save(); render();
};

const slotSel = document.getElementById("slot");
const teamSel = document.getElementById("teams");
function fillSlotOptions(){
  slotSel.innerHTML = "";
  for (let i = 1; i <= T; i++) slotSel.add(new Option(i, i));
  if (S.slot > T) S.slot = T;
  slotSel.value = S.slot;
}
for (let i = 4; i <= 16; i++) teamSel.add(new Option(i, i));
teamSel.value = T;
teamSel.onchange = e => { T = S.teams = +e.target.value; fillSlotOptions(); save(); render(); };
fillSlotOptions();
slotSel.onchange = e => { S.slot = +e.target.value; save(); render(); };

const cfgEl = document.getElementById("cfg");
cfgEl.innerHTML = Object.keys(S.lineup).map(k =>
  '<label>' + k + '</label><input type="number" min="0" max="6" value="' + S.lineup[k] + '" data-k="' + k + '">').join("");
cfgEl.querySelectorAll("input").forEach(i => i.onchange = e => {
  S.lineup[e.target.dataset.k] = +e.target.value; save(); render();
});
document.getElementById("src").innerHTML =
  "<b>Football Fanatics 2</b> · QB/WR/WR/RB/RB/TE/FLEX/K/DEF + 6 Bank · 15 Runden · 45 s pro Pick<br><br>" +
  M.scoring + " · ADP aus " + M.drafts.toLocaleString("de-DE") +
  " Drafts (" + M.window + "), allgemeine Half-PPR-ADP - nicht nach Ligagroesse gefiltert. " +
  "Prozent = Wahrscheinlichkeit, dass der Spieler bis zu deinem nächsten Pick noch da ist.<br><br>" +
  "Achtung: eure Liga gibt <b>6 Punkte pro Pass-TD</b> (Yahoo-Standard: 4) und <b>-2 pro Interception</b>. " +
  "Die ADP-Quelle rechnet mit dem Standard, QBs sind hier also etwas mehr wert als ihre ADP zeigt.";

render();
q.focus();
</script>
